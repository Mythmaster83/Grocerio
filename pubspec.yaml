name: grocer
description: "Production-grade grocery & stock list manager."
publish_to: 'none'
version: 0.1.0+1

environment:
  # Raised for supabase_flutter, which needs Dart >= 3.9.
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Local storage ---
  # All three must share the same version (Dart API + native core + generator).
  # Community fork ships 16KB-aligned Android libisar.so for Play / Android 15+.
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  path_provider: ^2.1.3

  # --- Voice input ---
  speech_to_text: ^7.0.0

  # --- Item icons ---
  # Offline, bundled SVG icon sets. Replaces the old Pexels/proxy image
  # search: no network call, no API key, no rate limit per item added.
  iconify_flutter: ^0.0.7
  colorful_iconify_flutter: ^0.0.5

  # --- UX / utils ---
  flutter_slidable: ^3.1.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  logger: ^2.3.0
  equatable: ^2.0.5
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  # --- Accounts, sharing, and price sync ---
  # Optional at runtime: with no SUPABASE_URL/SUPABASE_ANON_KEY dart-defines the
  # client is never initialized and the app stays entirely local.
  supabase_flutter: ^2.17.2
  geolocator: ^14.0.3
  permission_handler: ^13.0.1
  shared_preferences: ^2.5.5
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_community_generator: 3.3.2
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: assets/branding/app_icon_source.png
    icon_size: 256
  image_path: assets/branding/app_icon_source.png
  adaptive_icon_background: "#8FA88A"
  adaptive_icon_foreground: assets/branding/app_icon_source.png
  remove_alpha_ios: true
  background_color_ios: "#8FA88A"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/catalog/
