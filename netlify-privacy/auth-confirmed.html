<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email verified — Grocerio</title>
  <meta name="description" content="Your Grocerio email is verified. Return to the app to sign in." />
  <style>
    :root {
      --bg: #0b0d0c;
      --surface: #141815;
      --text: #f1f4f2;
      --muted: #8b948d;
      --accent: #7fe0a8;
      --on-accent: #07130c;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #152019 0%, var(--bg) 55%);
      color: var(--text);
      padding: 1.5rem;
    }
    .card {
      width: min(100%, 26rem);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .check {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.25rem;
      border-radius: 999px;
      background: rgba(127, 224, 168, 0.16);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-size: 2rem;
      font-weight: 700;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 0.5rem;
    }
    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.98rem;
    }
    a.button {
      display: inline-block;
      background: var(--accent);
      color: var(--on-accent);
      text-decoration: none;
      font-weight: 700;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Email verified</h1>
    <p>
      Your Grocerio account is confirmed. Open the app and sign in with the
      email and password you chose.
    </p>
    <a class="button" id="open-app" href="io.grocerio://login-callback/">
      Return to Grocerio
    </a>
    <p class="hint">If the app does not open, switch to Grocerio manually and tap Sign in.</p>
  </main>
  <script>
    // Best-effort deep link; browsers may block custom schemes without a tap.
    setTimeout(function () {
      window.location.href = 'io.grocerio://login-callback/';
    }, 400);
  </script>
</body>
</html>
